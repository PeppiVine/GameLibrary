<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
</head>

<body>
    <h1 th:text="${message}"></h1>
    <h2>Books</h2>
    <p>
        Logged in: <span sec:authentication="name"></span>
    </p>
    <table>
        <thead>
            <tr>
                <th>Author</th>
                <th>Title</th>
                <th>Isbn</th>
                <th>Year</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.isbn}">Isbn</td>
                <td th:text="${book.publicationYear}">Year</td>

                <td th:text="${book.category !=null ? book.category.name : '-'}"></td>
                <td>
                    <a th:href="@{/edit/{id}(id=${book.id})}">Edit</a>
                </td>

                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/delete/{id}(id=${book.id})}">Delete</a>
                </td>

            </tr>

        </tbody>
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="log out" />
        </form>
    </table>
    <p><a th:href="@{/add}">Add book</a></p>
</body>

</html>
